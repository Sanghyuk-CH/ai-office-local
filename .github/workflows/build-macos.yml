name: 맥 앱 빌드

# main에 올리거나 v로 시작하는 태그를 달면 빌드한다. Actions 탭에서 손으로도 돌릴 수 있다
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      - run: npm ci

      - name: 코어 테스트
        run: cargo test -p office-core

      # 애플 실리콘·인텔 둘 다 되는 유니버설 앱. 개발자 인증서 없이 임시 서명(-)만 한다
      - name: 앱 빌드
        run: npm run tauri build -- --target universal-apple-darwin --bundles app,dmg

      - name: dmg 올리기
        uses: actions/upload-artifact@v4
        with:
          name: ai-office-macos
          path: target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error

      - name: 태그면 릴리스에도 올리기
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: target/universal-apple-darwin/release/bundle/dmg/*.dmg
